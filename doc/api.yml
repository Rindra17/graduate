      name: page
      in: query
      required: false
      description: Numéro de page (0-indexé)
      schema:
        type: integer
        default: 0
        minimum: 0
    size:
      name: size
      in: query
      required: false
      description: Nombre d'éléments par page
      schema:
        type: integer
        default: 10
        minimum: 1
    courseId:
      name: id
      in: path
      required: true
      description: Identifiant du cours
      schema:
        type: string
        format: uuid
    teacherId:
      name: teacherId
      in: path
      required: true
      description: Identifiant de l'enseignant
      schema:
        type: string
        format: uuid
    studentId:
      name: studentId
      in: path
      required: true
      description: Identifiant de l'étudiant
      schema:
        type: string
        format: uuid
    idStudent:
      name: idStudent
      in: path
      required: true
      description: Identifiant de l'étudiant
      schema:
        type: string
        format: uuid
    groupId:
